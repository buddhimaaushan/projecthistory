version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      TEMPUS_DATABASE_URL: sqlite:////data/tempus.db
    volumes:
      - tempus-data:/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn tempus.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  tempus-data:
